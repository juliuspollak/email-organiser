name: Publish Raspberry Pi image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ARM64 container to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Run offline safety regression tests
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python3 -m py_compile organiser.py

      - name: Verify safe defaults and version
        shell: bash
        run: |
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          cfg = yaml.safe_load(Path('config.yaml').read_text())
          assert cfg['version'] == '1.1.4', 'Update the release version before publishing'
          assert cfg['arch'] == ['aarch64']
          assert cfg['options']['mode'] == 'dry_run'
          assert cfg['options']['enable_actions'] is False
          assert cfg['options']['enable_unsubscribe'] is False
          print('Release checks passed')
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/juliuspollak/email-organiser:1.1.4
          build-args: |
            BUILD_VERSION=1.1.4
            BUILD_ARCH=aarch64
          labels: |
            org.opencontainers.image.source=https://github.com/juliuspollak/email-organiser
            org.opencontainers.image.version=1.1.4
            org.opencontainers.image.description=Personal email organiser for Home Assistant OS
