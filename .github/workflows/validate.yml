name: Validate Email Organiser (ARM64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python and build Raspberry Pi image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python dependencies and run offline policy tests
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python3 -m py_compile organiser.py

      - name: Check configuration and safety defaults
        run: |
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path("config.yaml").read_text())
          assert data["slug"] == "email_organiser"
          assert "aarch64" in data["arch"]
          assert data["options"] == {}
          assert data["schema"] == {}
          assert data["schema"] == {}
          assert Path("Dockerfile").is_file()
          assert Path("requirements.txt").is_file()
          print("Home Assistant configuration and safe defaults: OK")
          PY

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: |
            BUILD_VERSION=1.5.0
            BUILD_ARCH=aarch64
          tags: email-organiser:ci
